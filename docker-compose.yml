version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: tame_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tame_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://neondb_owner:npg_rKClaE9TIW7b@ep-silent-haze-ap3tyf3j-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 tame_backend.asgi:application"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tame_celery_worker
    restart: always
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DATABASE_URL: postgresql://neondb_owner:npg_rKClaE9TIW7b@ep-silent-haze-ap3tyf3j-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A tame_backend worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tame_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  redisdata:
  static_files:
  media_files:
