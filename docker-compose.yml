version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tame_postgres
    restart: always
    environment:
      POSTGRES_DB: tame_db
      POSTGRES_USER: tame_admin
      POSTGRES_PASSWORD: tame_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tame_admin -d tame_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tame_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tame_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      USE_SQLITE: "False"
      POSTGRES_DB: tame_db
      POSTGRES_USER: tame_admin
      POSTGRES_PASSWORD: tame_secure_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 tame_backend.asgi:application"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tame_celery_worker
    restart: always
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      USE_SQLITE: "False"
      POSTGRES_DB: tame_db
      POSTGRES_USER: tame_admin
      POSTGRES_PASSWORD: tame_secure_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A tame_backend worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tame_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  redisdata:
  static_files:
  media_files:
