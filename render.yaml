services:
  # ─── Django Backend (ASGI / Daphne for WebSocket support) ───────────────────
  - type: web
    name: tame-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT tame_backend.asgi:application"
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_rKClaE9TIW7b@ep-silent-haze-ap3tyf3j-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: REDIS_URL
        fromService:
          name: tame-redis
          type: redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tame-frontend.onrender.com,http://localhost:3000"

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  - type: worker
    name: tame-celery-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A tame_backend worker --loglevel=info --concurrency=2"
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: tame-backend
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_rKClaE9TIW7b@ep-silent-haze-ap3tyf3j-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: REDIS_URL
        fromService:
          name: tame-redis
          type: redis
          property: connectionString

  # ─── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: tame-redis
    plan: free
    maxmemoryPolicy: noeviction

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  - type: web
    name: tame-frontend
    runtime: node
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "node .next/standalone/server.js"
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: tame-backend
          type: web
          property: host
          transform: "https://{value}"
      - key: NODE_ENV
        value: production
